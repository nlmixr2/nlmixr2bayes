# Weekly run of the nightly-scale gates behind NLMIXR2STAN_SLOW (G5
# simulation-based calibration in test-sbc.R, G6 FOCEi agreement in
# test-focei-agree.R, ...) together with every other test file and the
# hand-coded .stan bridge suite -- the same _tests.yaml shards ci.yaml's full
# tier uses, with `slow` on.  Kept out of ci.yaml's nightly full tier because
# it takes hours.  The slow-gated files skip in the run tests/ci-timings.csv
# comes from (recorded at 0 s), so .github/scripts/ci-shards.R deals them out
# round-robin, one per shard, rather than by time.
#
# The shard timeout stays under GitHub's 6 h job limit, so a shard that runs
# away fails with its per-file progress log showing which file it was in,
# rather than vanishing as "cancelled" with no output (the old R CMD check
# based run buffered all test output).  The JUnit file is written only at
# the end, so a timed-out shard uploads none.
on:
  schedule:
    # Weekly, Saturdays 04:30 UTC.
    - cron: '30 4 * * 6'
  workflow_dispatch:
    inputs:
      sbcN:
        description: "SBC replicate count (NLMIXR2STAN_SBC_N; default 40)"
        required: false
        default: ''

name: slow-tests.yaml

permissions: read-all

# Never overlap slow-test runs (they are long); let an in-progress run finish.
concurrency:
  group: slow-tests
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/_tests.yaml
    with:
      matrix: >-
        [{"subset": "all", "os": "ubuntu-latest", "r": "release", "index": 1, "n": 6},
         {"subset": "all", "os": "ubuntu-latest", "r": "release", "index": 2, "n": 6},
         {"subset": "all", "os": "ubuntu-latest", "r": "release", "index": 3, "n": 6},
         {"subset": "all", "os": "ubuntu-latest", "r": "release", "index": 4, "n": 6},
         {"subset": "all", "os": "ubuntu-latest", "r": "release", "index": 5, "n": 6},
         {"subset": "all", "os": "ubuntu-latest", "r": "release", "index": 6, "n": 6}]
      slow: true
      sbc-n: ${{ inputs.sbcN || '40' }}
      timeout: 340
